<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPT Cyber Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:'Cairo',Arial,sans-serif;color-scheme:dark;--bg:#06101d;--panel:#0d1a2b;--panel2:#091625;--border:#213a56;--text:#eef6ff;--muted:#9eb2c9;--accent:#1bd3cf;--accent2:#77f2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.wrap{max-width:1450px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px}.hero h1{margin:0}.hero p{color:var(--muted);margin:5px 0}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}.tab,.action{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.tab{background:#13263a;color:#e6f0fb}.tab.active,.action{background:var(--accent);color:#021011}.secondary{background:#172d43!important;color:#e7f3ff!important}.danger{background:#3a1d28!important;color:#ffd7df!important}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px}.topics-head,.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.counter{font-size:12px;color:var(--accent2);background:#10283a;padding:5px 9px;border-radius:30px}.topic-list{display:grid;gap:8px;max-height:720px;overflow:auto;margin-top:12px}.topic-btn{width:100%;text-align:right;padding:12px;border:1px solid #294662;border-radius:12px;background:#0a1726;color:#eaf3ff;cursor:pointer}.topic-btn.selected,.topic-btn:hover{border-color:var(--accent);background:#10283a}.topic-btn small{display:block;color:var(--muted);margin-top:4px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;color:#b1c2d6;margin:8px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #29435f;border-radius:10px;background:#071421;color:#fff}textarea{min-height:84px}.check{display:flex;align-items:center;gap:8px;margin-top:10px;color:#c5d6e8}.check input{width:auto}.status{min-height:24px;color:var(--muted);margin-top:10px}.hidden{display:none!important}.output{margin-top:20px}.slides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.slide{background:var(--panel2);border:1px solid #294760;border-radius:16px;overflow:hidden}.art{position:relative;aspect-ratio:4/5;background:#eef3f8;overflow:hidden}.art>img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#60768c;background:linear-gradient(145deg,#eef3f8,#dfe8f2)}.overlay{position:absolute;inset:0;direction:rtl;color:#0a2454;pointer-events:none}.overlay-head{position:absolute;top:7%;right:7%;left:7%;font-weight:800;font-size:clamp(20px,2.2vw,32px);line-height:1.35;text-align:right;text-shadow:0 1px 8px rgba(255,255,255,.95)}.overlay-body{position:absolute;top:22%;right:7%;width:48%;font-size:clamp(12px,1.15vw,17px);font-weight:600;line-height:1.7;color:#172b48;background:rgba(255,255,255,.77);padding:10px 12px;border-radius:12px;backdrop-filter:blur(4px)}.overlay-footer{position:absolute;right:6%;bottom:3%;font-size:clamp(9px,.9vw,13px);font-weight:700;color:#102b61;background:rgba(255,255,255,.82);padding:5px 9px;border-radius:8px}.slide-no{position:absolute;left:4%;bottom:3%;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#08295c;color:#fff;font-weight:800}.slide-info{padding:13px}.slide-info h4{margin:4px 0}.slide-info p{color:#cbd9e8;line-height:1.65}.slide-actions{display:flex;gap:7px;flex-wrap:wrap}.slide-actions button,.copy-btn{border:0;border-radius:8px;padding:8px 10px;background:#173149;color:#def;cursor:pointer}.pill{display:inline-block;padding:5px 9px;margin:3px;border-radius:20px;background:#142d43;color:#c4f5f2}.source{padding:8px 0;border-bottom:1px solid #1b3147}.source a{color:#67e4ff}.archive-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.archive-item{background:#0a1726;border:1px solid #28455f;border-radius:15px;padding:15px}.archive-item p,.date{color:var(--muted);font-size:13px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:1fr}.topic-list{max-height:320px}.archive-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.wrap{padding:14px}.hero{display:block}.tabs{margin-top:12px}.form-grid,.slides,.archive-grid{grid-template-columns:1fr}.overlay-body{width:60%}}
.overlay-head{top:9%;right:5%;left:5%;padding:10px 14px;font-size:clamp(20px,2.2vw,32px);line-height:1.32;text-shadow:none;background:rgba(255,255,255,.94);border-radius:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.overlay-body{top:auto;right:5%;left:5%;bottom:8%;width:auto;padding:10px 14px;font-size:clamp(11px,1.05vw,16px);line-height:1.55;background:rgba(255,255,255,.94);border-radius:10px;backdrop-filter:none;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.overlay-footer{right:5%;bottom:2%;background:rgba(255,255,255,.94)}.slide-no{bottom:2%}
@media(max-width:720px){.overlay-body{width:auto}}
</style></head>
<body><div class="wrap">
<header class="hero"><div><h1>GPT Cyber Content</h1><p>GRC والأمن السيبراني — محتوى سريع، صور منفصلة، وأرشيف مركزي.</p></div><nav class="tabs"><button class="tab active" data-view="studio">الاستوديو</button><button class="tab" data-view="archive">الأرشيف <span id="archiveCount"></span></button></nav></header>
<section id="studio" class="layout"><aside class="card"><div class="topics-head"><strong>مواضيع الـ30 يوم</strong><span id="remaining" class="counter">...</span></div><div id="topicList" class="topic-list"></div></aside>
<main class="card"><div class="form-grid"><div class="full"><label>الموضوع</label><textarea id="topic" placeholder="اختر موضوعًا أو اكتب موضوعك"></textarea></div><div><label>المجال</label><select id="domain"><option>GRC</option><option>Cybersecurity</option><option>AI Governance</option><option>Privacy</option></select></div><div><label>نوع المنشور</label><select id="type"><option>Carousel</option><option>Infographic</option><option>Single Post</option></select></div><div><label>المنصة</label><select id="platform"><option>Both</option><option>Instagram</option><option>LinkedIn</option></select></div><div><label>عدد الشرائح</label><input id="slides" type="number" min="1" max="10" value="6"></div><div class="full"><label>الجمهور</label><input id="audience" value="Government and enterprise cybersecurity professionals"></div></div>
<label class="check"><input id="webSearch" type="checkbox"> التحقق من مصادر عالمية حديثة (أبطأ، لكنه أفضل للمواضيع الجديدة والتشريعات)</label>
<div class="row"><button id="generate" class="action">إنشاء المحتوى</button><button id="generateImages" class="action secondary hidden">إنشاء جميع الصور</button><button id="clear" class="action secondary">مسح الاختيار</button></div><div id="msg" class="status"></div><div id="result" class="output hidden"></div></main></section>
<section id="archive" class="card hidden"><div class="section-title"><h2>أرشيف المنشورات</h2><button id="refreshArchive" class="action secondary">تحديث</button></div><div id="archiveGrid" class="archive-grid"></div></section>
</div>
<script>
const API='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const TOPICS=[
{id:1,title:'ما هو GRC ولماذا أصبح أساس الأمن السيبراني؟',detail:'Governance • Risk • Compliance',domain:'GRC'},{id:2,title:'الفرق بين الأمن السيبراني و GRC',detail:'تكامل الأدوار والمسؤوليات',domain:'GRC'},{id:3,title:'لماذا تفشل برامج ISO 27001 رغم الحصول على الشهادة؟',detail:'الشهادة مقابل التطبيق المستمر',domain:'GRC'},{id:4,title:'NIST CSF 2.0 والتغيير الأكبر: وظيفة Govern',detail:'الحوكمة والإدارة العليا',domain:'GRC'},{id:5,title:'من هو مالك المخاطر الحقيقي داخل المؤسسة؟',detail:'Risk Owners ومسؤولية الأعمال',domain:'GRC'},{id:6,title:'كيف تبني Risk Register بطريقة صحيحة؟',detail:'من التقييم إلى المعالجة',domain:'GRC'},{id:7,title:'Risk Appetite في الجهات الحكومية',detail:'شهية المخاطر وحدود القبول',domain:'GRC'},{id:8,title:'Third-Party Risk Management',detail:'مخاطر الموردين',domain:'GRC'},{id:9,title:'Supply Chain Cybersecurity',detail:'سلسلة التوريد',domain:'Cybersecurity'},{id:10,title:'Continuous Compliance',detail:'الامتثال المستمر',domain:'GRC'},{id:11,title:'AI Governance: لماذا أصبح الذكاء الاصطناعي جزءًا من GRC؟',detail:'حوكمة AI',domain:'AI Governance'},{id:12,title:'ISO/IEC 42001 لإدارة الذكاء الاصطناعي',detail:'AI Management System',domain:'AI Governance'},{id:13,title:'Shadow AI داخل المؤسسات',detail:'استخدام AI دون رقابة',domain:'AI Governance'},{id:14,title:'Board Cyber Governance',detail:'مسؤولية الإدارة العليا',domain:'GRC'},{id:15,title:'KPI vs KRI: ما المؤشرات التي يحتاجها GRC؟',detail:'الأداء والمخاطر',domain:'GRC'},{id:16,title:'كيف تقيس نضج برنامج GRC؟',detail:'Maturity Assessment',domain:'GRC'},{id:17,title:'NIS2 باختصار: ما الذي تغير؟',detail:'التوجيه الأوروبي',domain:'GRC'},{id:18,title:'DORA والمرونة التشغيلية الرقمية',detail:'القطاع المالي',domain:'GRC'},{id:19,title:'Cyber Resilience Act وتأثيره على المنتجات الرقمية',detail:'دورة حياة المنتج',domain:'Cybersecurity'},{id:20,title:'إدارة الاستثناءات الأمنية بطريقة صحيحة',detail:'Security Exceptions',domain:'GRC'},{id:21,title:'Security Awareness أم Security Culture؟',detail:'التدريب مقابل السلوك',domain:'Cybersecurity'},{id:22,title:'لماذا تفشل سياسات الأمن السيبراني؟',detail:'Policy Management',domain:'GRC'},{id:23,title:'Least Privilege ومراجعة الصلاحيات',detail:'حوكمة الوصول',domain:'Cybersecurity'},{id:24,title:'إدارة الثغرات من منظور GRC',detail:'Vulnerability + Risk',domain:'GRC'},{id:25,title:'إدارة الحوادث وعلاقتها بإدارة المخاطر',detail:'Incident + Risk',domain:'GRC'},{id:26,title:'ماذا يبحث المدقق الداخلي في الأمن السيبراني؟',detail:'Audit Evidence',domain:'GRC'},{id:27,title:'Business Continuity وعلاقته بـ GRC',detail:'BCM والمرونة',domain:'GRC'},{id:28,title:'Cyber Metrics التي يجب عرضها للإدارة العليا',detail:'Executive Dashboard',domain:'GRC'},{id:29,title:'أكثر 10 أخطاء شائعة في برامج GRC',detail:'أخطاء عملية',domain:'GRC'},{id:30,title:'مستقبل GRC: AI Governance وAutomation وContinuous Compliance',detail:'اتجاهات حديثة',domain:'GRC'}];
let selectedTopicId=null,current=null,used=new Set();
async function api(path,opts={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const raw=await r.text();let d={};if(raw){try{d=JSON.parse(raw)}catch{if(/upstream error|bad gateway|service unavailable|gateway timeout/i.test(raw))throw new Error('الخدمة الخارجية غير متاحة مؤقتًا. انتظر قليلًا ثم أعد المحاولة.');throw new Error('استجابة غير صالحة من الخادم (HTTP '+r.status+').')}}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
async function refreshUsed(){try{const d=await api('/api/archive/used-topic-ids');used=new Set(d.topic_ids||[])}catch(e){$('msg').textContent='تعذر قراءة قاعدة البيانات: '+e.message}renderTopics()}
function renderTopics(){const list=$('topicList');const arr=TOPICS.filter(t=>!used.has(t.id));$('remaining').textContent=arr.length+' متبقي';list.innerHTML=arr.map(t=>`<button class="topic-btn ${selectedTopicId===t.id?'selected':''}" data-id="${t.id}">${esc(t.title)}<small>${esc(t.detail)}</small></button>`).join('')||'<div class="empty">تم استخدام جميع المواضيع.</div>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const t=TOPICS.find(x=>x.id===Number(b.dataset.id));selectedTopicId=t.id;$('topic').value=t.title;$('domain').value=t.domain;renderTopics()})}
function switchView(v){$('studio').classList.toggle('hidden',v!=='studio');$('archive').classList.toggle('hidden',v!=='archive');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='archive')renderArchive()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('clear').onclick=()=>{selectedTopicId=null;$('topic').value='';renderTopics()};$('refreshArchive').onclick=renderArchive;
async function saveArchive(){if(!current)return;const p={id:current.id||null,topic_id:current.topicId,topic:current.topic,domain:current.domain,post_type:current.postType,platform:current.platform,content:current.data};const d=await api('/api/archive',{method:'POST',body:JSON.stringify(p)});current.id=d.id}
$('generate').onclick=async()=>{const topic=$('topic').value.trim();if(!topic)return $('msg').textContent='اختر أو اكتب موضوعًا.';const btn=$('generate');btn.disabled=true;$('msg').textContent=$('webSearch').checked?'جاري إنشاء المحتوى والتحقق من المصادر...':'جاري إنشاء المحتوى...';const started=Date.now();try{const data=await api('/api/generate-content',{method:'POST',body:JSON.stringify({topic,domain:$('domain').value,post_type:$('type').value,platform:$('platform').value,audience:$('audience').value,language:'Arabic',slides:Number($('slides').value),use_web_search:$('webSearch').checked})});current={id:null,topicId:selectedTopicId,topic,domain:$('domain').value,postType:$('type').value,platform:$('platform').value,data};await saveArchive();if(selectedTopicId)used.add(selectedTopicId);renderTopics();renderResult();$('generateImages').classList.remove('hidden');$('msg').textContent=`تم إنشاء المحتوى خلال ${Math.max(1,Math.round((Date.now()-started)/1000))} ثانية. يمكنك الآن إنشاء الصور.`}catch(e){$('msg').textContent='خطأ: '+e.message}finally{btn.disabled=false}};
function visualCard(s,i){return `<article class="slide"><div class="art" id="art-${i}">${s.image_b64?`<img src="data:${esc(s.image_mime_type||'image/jpeg')};base64,${s.image_b64}" alt="Artwork">`:'<div class="placeholder">Artwork بدون نص — اضغط إنشاء الصور</div>'}<div class="overlay"><div class="overlay-head">${esc(s.headline)}</div><div class="overlay-body">${esc(s.body)}</div><div class="overlay-footer">نبض سيبراني | GRC | @cyberpulse_ar</div><div class="slide-no">${esc(s.number)}</div></div></div><div class="slide-info"><h4>${esc(s.headline)}</h4><p>${esc(s.body)}</p><div class="slide-actions"><button data-img="${i}">إنشاء/إعادة الصورة</button></div></div></article>`}
function grcPostText(d){
  const blocks=[];
  if(d.title)blocks.push(`🔐 ${d.title}`);
  if(d.hook)blocks.push(`💡 ${d.hook}`);
  if(d.caption)blocks.push(d.caption);
  const rec=(d.recommendations||[]).filter(Boolean);
  if(rec.length)blocks.push(`📌 التوصيات العملية:\n${rec.map(x=>`✅ ${x}`).join('\n')}`);
  if(d.cta)blocks.push(`🎯 ${d.cta}`);
  const src=(d.sources||[]).filter(x=>x&&(x.name||x.url));
  if(src.length)blocks.push(`🔗 المصادر:\n${src.map(x=>`• ${x.name||'المصدر'}${x.url?`: ${x.url}`:''}`).join('\n')}`);
  const tags=(d.hashtags||[]).filter(Boolean).map(x=>x.startsWith('#')?x:`#${x}`);
  if(tags.length)blocks.push(tags.join(' '));
  return blocks.join('\n\n');
}
function renderResult(){
  if(!current)return;
  const d=current.data,r=$('result');r.classList.remove('hidden');
  const slides=(d.slides||[]).map(visualCard).join('');
  const rec=(d.recommendations||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  const keys=(d.keywords||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('');
  const tags=(d.hashtags||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('');
  const src=(d.sources||[]).map(x=>`<div class="source"><a href="${esc(x.url)}" target="_blank">${esc(x.name)}</a> — ${esc(x.why_relevant||'')}</div>`).join('');
  r.innerHTML=`<h2>${esc(d.title)}</h2><h3>Hook</h3><p>${esc(d.hook)}</p><div class="section-title"><h3>الشرائح</h3><span>${d.web_verified?'تم التحقق من مصادر حديثة':'وضع سريع'}</span></div><div class="slides">${slides}</div><div class="section-title"><h3>Caption</h3><button id="copyCaption" class="copy-btn">نسخ منشور لينكدإن</button></div><p>${esc(d.caption)}</p><h3>التوصيات</h3><ul>${rec}</ul><h3>CTA</h3><p>${esc(d.cta)}</p><h3>SEO Keywords</h3>${keys}<h3>Hashtags</h3>${tags}<h3>المصادر</h3>${src||'<p>فعّل «التحقق من مصادر عالمية حديثة» عند الحاجة إلى مصادر حديثة.</p>'}`;
  $('copyCaption').onclick=()=>navigator.clipboard.writeText(grcPostText(d)).then(()=>$('msg').textContent='تم نسخ منشور لينكدإن منسقًا بالأيقونات.');
  r.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>generateImage(Number(b.dataset.img),true));
}
async function generateImage(i,save=true){if(!current)return;const s=current.data.slides[i],art=$('art-'+i);if(art)art.querySelector('.placeholder')?.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'جاري إنشاء الـArtwork...'}));try{const d=await api('/api/generate-image',{method:'POST',body:JSON.stringify({title:s.headline,body:s.body,slide_number:s.number,post_type:current.postType,domain:current.domain,visual_style:'GRC Professional'})});s.image_b64=d.b64_json;s.image_mime_type=d.mime_type||'image/jpeg';if(save)await saveArchive();renderResult();return true}catch(e){$('msg').textContent='تعذر إنشاء صورة '+s.number+': '+e.message;return false}}
$('generateImages').onclick=async()=>{if(!current)return;const b=$('generateImages');b.disabled=true;$('msg').textContent='جاري إنشاء الصور على دفعات...';const idx=[...(current.data.slides||[]).keys()];try{for(let x=0;x<idx.length;x+=3){await Promise.all(idx.slice(x,x+3).map(i=>generateImage(i,false)))}await saveArchive();renderResult();$('msg').textContent='اكتملت الصور. النص العربي المعروض فوق الصور منفصل وبخط Cairo.'}finally{b.disabled=false}};
async function renderArchive(){const grid=$('archiveGrid');grid.innerHTML='<div class="empty">جاري تحميل الأرشيف...</div>';try{const posts=await api('/api/archive');$('archiveCount').textContent=posts.length?'('+posts.length+')':'';grid.innerHTML=posts.length?posts.map(p=>`<article class="archive-item"><div class="date">${esc(new Date(p.created_at).toLocaleString('ar-AE'))}</div><h3>${esc(p.topic)}</h3><p>${esc(p.domain)} • ${esc(p.post_type)}</p><div class="row"><button class="action secondary" data-open="${p.id}">فتح</button><button class="action danger" data-del="${p.id}">إعادة للقائمة/حذف</button></div></article>`).join(''):'<div class="empty">لا توجد منشورات مؤرشفة.</div>';grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{const p=await api('/api/archive/'+b.dataset.open);current={id:p.id,topicId:p.topic_id,topic:p.topic,domain:p.domain,postType:p.post_type,platform:p.platform,data:p.content};selectedTopicId=p.topic_id;$('topic').value=p.topic;$('domain').value=p.domain;$('type').value=p.post_type;$('platform').value=p.platform;renderResult();$('generateImages').classList.remove('hidden');switchView('studio')});grid.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف المنشور وإعادة الموضوع للقائمة؟'))return;await api('/api/archive/'+b.dataset.del,{method:'DELETE'});await refreshUsed();await renderArchive()})}catch(e){grid.innerHTML='<div class="empty">تعذر تحميل الأرشيف: '+esc(e.message)+'</div>'}}
(async()=>{await refreshUsed()})();
</script><script src="/mobile-download.js?v=0.25.0"></script></body></html>
