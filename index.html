<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPT Cyber Content</title>
<style>
:root{font-family:Arial,Tahoma,sans-serif;color-scheme:dark;--bg:#06101d;--panel:#0d1a2b;--panel2:#091625;--border:#213a56;--text:#eef6ff;--muted:#9eb2c9;--accent:#1bd3cf;--accent2:#77f2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.wrap{max-width:1440px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:20px}.hero h1{margin:0;font-size:31px}.hero p{margin:7px 0 0;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:0;border-radius:11px;padding:10px 16px;background:#12263a;color:#dceaff;font-weight:700;cursor:pointer}.tab.active{background:var(--accent);color:#031214}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px}.topics-head,.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.counter{font-size:12px;color:var(--accent2);background:#10283a;padding:5px 9px;border-radius:30px}.topic-list{display:grid;gap:8px;margin-top:12px;max-height:720px;overflow:auto;padding-left:4px}.topic-btn{width:100%;text-align:right;padding:12px;border:1px solid #294662;border-radius:12px;background:#0a1726;color:#eaf3ff;cursor:pointer;line-height:1.5}.topic-btn:hover,.topic-btn.selected{border-color:var(--accent);background:#10283a}.topic-btn small{display:block;color:var(--muted);margin-top:4px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;color:#b1c2d6;margin:10px 0 6px}.full{grid-column:1/-1}input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #29435f;background:#071421;color:white}textarea{min-height:88px;resize:vertical}button.action{border:0;border-radius:11px;padding:12px 15px;margin-top:12px;background:var(--accent);color:#021011;font-weight:700;cursor:pointer}.secondary{background:#172d43!important;color:#e7f3ff!important}.ghost{background:transparent!important;border:1px solid #36526e!important;color:#cfe3f7!important}.danger{background:#3a1d28!important;color:#ffd7df!important}.button-row{display:flex;gap:8px;flex-wrap:wrap}.button-row button{width:auto}.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}.hidden{display:none!important}.output{margin-top:18px}.output h2{margin-top:0}.copy-btn{border:0;border-radius:9px;padding:8px 11px;background:#173149;color:#dff;cursor:pointer}.slides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.slide{border:1px solid #294760;border-radius:16px;overflow:hidden;background:var(--panel2)}.slide-visual{aspect-ratio:1/1;background:linear-gradient(135deg,#0b2033,#102b40);display:flex;align-items:center;justify-content:center}.slide-visual img{width:100%;height:100%;object-fit:cover;display:block}.image-state{padding:18px;text-align:center;color:#9fb6ca}.slide-content{padding:14px}.slide-content b{color:var(--accent2)}.slide-content h4{margin:8px 0}.slide-content p{color:#d1ddeb;line-height:1.7}.slide-actions{display:flex;gap:7px}.slide-actions button{border:0;border-radius:8px;padding:8px 10px;background:#173149;color:#def;cursor:pointer}.pill{display:inline-block;padding:5px 9px;margin:3px;border-radius:20px;background:#142d43;color:#c4f5f2}.source{padding:9px 0;border-bottom:1px solid #1b3147}.source a{color:#67e4ff}.archive-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.archive-item{background:#0a1726;border:1px solid #28455f;border-radius:15px;padding:15px}.archive-item h3{font-size:17px;margin:4px 0 8px}.archive-item p{font-size:13px;color:var(--muted)}.archive-item .date{font-size:11px;color:#7f98b1}.empty-state{padding:40px 10px;text-align:center;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:1fr}.topic-list{max-height:340px}.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.wrap{padding:14px}.hero{display:block}.tabs{margin-top:14px}.form-grid,.slides,.archive-grid{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div><h1>GPT Cyber Content</h1><p>استوديو محتوى GRC والأمن السيبراني — الأرشيف متزامن عبر Railway/PostgreSQL.</p></div><nav class="tabs"><button class="tab active" data-view="studio">الاستوديو</button><button class="tab" data-view="archive">أرشيف المنشورات <span id="archiveCount"></span></button></nav></header>
<section id="studioView" class="layout">
<aside class="card"><div class="topics-head"><strong>مواضيع الـ30 يوم</strong><span class="counter" id="remainingCount">...</span></div><div class="topic-list" id="topicList"></div></aside>
<main class="card"><div class="form-grid">
<div class="full"><label>الموضوع</label><textarea id="topic" placeholder="اختر موضوعًا من القائمة أو اكتب موضوعًا جديدًا"></textarea></div>
<div><label>المجال</label><select id="domain"><option>GRC</option><option>Cybersecurity</option><option>AI Governance</option><option>Privacy</option></select></div>
<div><label>نوع المنشور</label><select id="type"><option>Carousel</option><option>Infographic</option><option>Single Post</option></select></div>
<div><label>المنصة</label><select id="platform"><option>Both</option><option>Instagram</option><option>LinkedIn</option></select></div>
<div><label>عدد الشرائح</label><input id="slides" type="number" min="1" max="10" value="6"></div>
<div class="full"><label>الجمهور</label><input id="audience" value="Government and enterprise cybersecurity professionals"></div></div>
<div class="button-row"><button id="generate" class="action">إنشاء المحتوى والصور</button><button id="clearSelection" class="action secondary">إلغاء اختيار الموضوع</button></div><div id="msg" class="status"></div><div id="result" class="output hidden"></div></main>
</section>
<section id="archiveView" class="card hidden"><div class="section-title"><h2>أرشيف المنشورات</h2><button id="refreshArchive" class="action secondary">تحديث</button></div><div id="archiveGrid" class="archive-grid"></div></section>
</div>
<script>
const API='';
const TOPICS=[
{id:1,title:'ما هو GRC ولماذا أصبح أساس الأمن السيبراني؟',detail:'Governance • Risk • Compliance',domain:'GRC'},{id:2,title:'الفرق بين الأمن السيبراني و GRC',detail:'كيف تتكامل الفرق والمسؤوليات',domain:'GRC'},{id:3,title:'لماذا تفشل برامج ISO 27001 رغم الحصول على الشهادة؟',detail:'الشهادة مقابل التطبيق المستمر',domain:'GRC'},{id:4,title:'NIST CSF 2.0 والتغيير الأكبر: وظيفة Govern',detail:'الحوكمة والإدارة العليا',domain:'GRC'},{id:5,title:'من هو مالك المخاطر الحقيقي داخل المؤسسة؟',detail:'Risk Owners ومسؤولية الأعمال',domain:'GRC'},{id:6,title:'كيف تبني Risk Register بطريقة صحيحة؟',detail:'سجل المخاطر من التقييم إلى المعالجة',domain:'GRC'},{id:7,title:'Risk Appetite في الجهات الحكومية',detail:'شهية المخاطر وحدود القبول',domain:'GRC'},{id:8,title:'Third-Party Risk Management',detail:'مخاطر الموردين والخدمات الخارجية',domain:'GRC'},{id:9,title:'Supply Chain Cybersecurity',detail:'مخاطر سلسلة التوريد السيبرانية',domain:'Cybersecurity'},{id:10,title:'Continuous Compliance',detail:'الامتثال المستمر بدل المراجعة السنوية',domain:'GRC'},{id:11,title:'AI Governance: لماذا أصبح الذكاء الاصطناعي جزءًا من GRC؟',detail:'حوكمة استخدام الذكاء الاصطناعي',domain:'AI Governance'},{id:12,title:'ISO/IEC 42001 لإدارة الذكاء الاصطناعي',detail:'نظام إدارة الذكاء الاصطناعي',domain:'AI Governance'},{id:13,title:'Shadow AI داخل المؤسسات',detail:'استخدام أدوات AI دون رقابة',domain:'AI Governance'},{id:14,title:'Board Cyber Governance',detail:'مسؤولية الإدارة العليا ومجلس الإدارة',domain:'GRC'},{id:15,title:'KPI vs KRI: ما المؤشرات التي يحتاجها GRC؟',detail:'قياس الأداء مقابل مؤشرات المخاطر',domain:'GRC'},{id:16,title:'كيف تقيس نضج برنامج GRC؟',detail:'GRC Maturity Assessment',domain:'GRC'},{id:17,title:'NIS2 باختصار: ما الذي تغير؟',detail:'التوجيه الأوروبي للأمن السيبراني',domain:'GRC'},{id:18,title:'DORA والمرونة التشغيلية الرقمية',detail:'المؤسسات والقطاع المالي',domain:'GRC'},{id:19,title:'Cyber Resilience Act وتأثيره على المنتجات الرقمية',detail:'الأمن طوال دورة حياة المنتج',domain:'Cybersecurity'},{id:20,title:'إدارة الاستثناءات الأمنية بطريقة صحيحة',detail:'Security Exceptions ومدة الصلاحية',domain:'GRC'},{id:21,title:'Security Awareness أم Security Culture؟',detail:'التدريب مقابل تغيير السلوك',domain:'Cybersecurity'},{id:22,title:'لماذا تفشل سياسات الأمن السيبراني؟',detail:'Policy Management والتطبيق الفعلي',domain:'GRC'},{id:23,title:'Least Privilege ومراجعة الصلاحيات',detail:'حوكمة الوصول والصلاحيات',domain:'Cybersecurity'},{id:24,title:'إدارة الثغرات من منظور GRC',detail:'ربط Vulnerability Management بالمخاطر',domain:'GRC'},{id:25,title:'إدارة الحوادث وعلاقتها بإدارة المخاطر',detail:'Incident Management + Risk',domain:'GRC'},{id:26,title:'ماذا يبحث المدقق الداخلي في الأمن السيبراني؟',detail:'Audit Evidence وفعالية الضوابط',domain:'GRC'},{id:27,title:'Business Continuity وعلاقته بـ GRC',detail:'BCM والمرونة المؤسسية',domain:'GRC'},{id:28,title:'Cyber Metrics التي يجب عرضها للإدارة العليا',detail:'Executive Cyber Dashboard',domain:'GRC'},{id:29,title:'أكثر 10 أخطاء شائعة في برامج GRC',detail:'أخطاء عملية وكيفية معالجتها',domain:'GRC'},{id:30,title:'مستقبل GRC: AI Governance وAutomation وContinuous Compliance',detail:'اتجاهات GRC الحديثة',domain:'GRC'}];
let selectedTopicId=null,currentRecord=null,usedTopicIds=new Set();const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opts={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
async function refreshUsed(){try{const d=await api('/api/archive/used-topic-ids');usedTopicIds=new Set(d.topic_ids||[])}catch(e){$('msg').textContent='قاعدة البيانات غير متاحة: '+e.message;usedTopicIds=new Set()}renderTopics()}
function renderTopics(){const list=$('topicList');list.innerHTML='';const available=TOPICS.filter(t=>!usedTopicIds.has(t.id));$('remainingCount').textContent=available.length+' متبقي';available.forEach(t=>{const b=document.createElement('button');b.className='topic-btn'+(selectedTopicId===t.id?' selected':'');b.innerHTML=`${esc(t.title)}<small>${esc(t.detail)}</small>`;b.onclick=()=>{selectedTopicId=t.id;$('topic').value=t.title;$('domain').value=t.domain;renderTopics()};list.appendChild(b)});if(!available.length)list.innerHTML='<div class="empty-state">تم استخدام جميع المواضيع المقترحة.</div>'}
function switchView(view){$('studioView').classList.toggle('hidden',view!=='studio');$('archiveView').classList.toggle('hidden',view!=='archive');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='archive')renderArchive()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('clearSelection').onclick=()=>{selectedTopicId=null;$('topic').value='';renderTopics()};$('refreshArchive').onclick=renderArchive;
async function renderArchive(){const grid=$('archiveGrid');grid.innerHTML='<div class="empty-state">جاري تحميل الأرشيف...</div>';try{const posts=await api('/api/archive');$('archiveCount').textContent=posts.length?'('+posts.length+')':'';if(!posts.length){grid.innerHTML='<div class="empty-state">لا توجد منشورات مؤرشفة بعد.</div>';return}grid.innerHTML=posts.map(p=>`<article class="archive-item"><div class="date">${esc(new Date(p.created_at).toLocaleString('ar-AE'))}</div><h3>${esc(p.topic)}</h3><p>${esc(p.domain)} • ${esc(p.post_type)} • ${esc(p.platform)}</p><div class="button-row"><button class="action secondary" data-open="${esc(p.id)}">فتح</button><button class="action ghost" data-restore="${esc(p.id)}">إعادة للقائمة</button><button class="action danger" data-delete="${esc(p.id)}">حذف</button></div></article>`).join('');grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openArchived(b.dataset.open));grid.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restorePost(b.dataset.restore));grid.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deletePost(b.dataset.delete))}catch(e){grid.innerHTML='<div class="empty-state">تعذر تحميل الأرشيف: '+esc(e.message)+'</div>'}}
async function openArchived(id){try{const p=await api('/api/archive/'+id);currentRecord={id:p.id,topicId:p.topic_id,topic:p.topic,domain:p.domain,postType:p.post_type,platform:p.platform,data:p.content};$('topic').value=p.topic;$('domain').value=p.domain;$('type').value=p.post_type;$('platform').value=p.platform;selectedTopicId=p.topic_id;renderResult(p.content,true);switchView('studio');$('msg').textContent='تم فتح المنشور من PostgreSQL.'}catch(e){alert(e.message)}}
async function restorePost(id){try{await api('/api/archive/'+id,{method:'DELETE'});await refreshUsed();await renderArchive()}catch(e){alert(e.message)}}
async function deletePost(id){if(!confirm('حذف هذا المنشور من الأرشيف؟'))return;await restorePost(id)}
async function saveArchive(record){const payload={id:record.id||null,topic_id:record.topicId,topic:record.topic,domain:record.domain,post_type:record.postType,platform:record.platform,content:record.data};const r=await api('/api/archive',{method:'POST',body:JSON.stringify(payload)});record.id=r.id;return r.id}
$('generate').onclick=async()=>{const topic=$('topic').value.trim();if(!topic){$('msg').textContent='اختر أو اكتب موضوعًا.';return}const btn=$('generate');btn.disabled=true;$('msg').textContent='جاري إنشاء المحتوى...';try{const data=await api('/api/generate-content',{method:'POST',body:JSON.stringify({topic,domain:$('domain').value,post_type:$('type').value,platform:$('platform').value,audience:$('audience').value,language:'Arabic',slides:Number($('slides').value),use_web_search:true})});currentRecord={id:null,topicId:selectedTopicId,topic,domain:$('domain').value,postType:$('type').value,platform:$('platform').value,data};await saveArchive(currentRecord);if(selectedTopicId)usedTopicIds.add(selectedTopicId);renderTopics();renderResult(data,false);$('msg').textContent='تم إنشاء المحتوى وحفظه في PostgreSQL. جاري إنشاء الصور...';await generateAllImages();await saveArchive(currentRecord);$('msg').textContent='اكتمل المحتوى والصور وتم تحديث الأرشيف.'}catch(e){$('msg').textContent='خطأ: '+e.message}finally{btn.disabled=false}};
function renderResult(d,archived=false){const r=$('result');r.classList.remove('hidden');const slides=(d.slides||[]).map((s,i)=>`<article class="slide"><div class="slide-visual" id="visual-${i}">${s.image_b64?`<img src="data:image/png;base64,${s.image_b64}" alt="صورة السلايد ${s.number}">`:'<div class="image-state">لم تُنشأ الصورة بعد</div>'}</div><div class="slide-content"><b>Slide ${esc(s.number)}</b><h4>${esc(s.headline)}</h4><p>${esc(s.body)}</p><div class="slide-actions"><button data-img="${i}">إنشاء/إعادة الصورة</button>${s.image_b64?`<button data-download="${i}">تنزيل الصورة</button>`:''}</div></div></article>`).join('');const rec=(d.recommendations||[]).map(x=>`<li>${esc(x)}</li>`).join('');const keys=(d.keywords||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('');const tags=(d.hashtags||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('');const src=(d.sources||[]).map(x=>`<div class="source"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a> — ${esc(x.why_relevant||'')}</div>`).join('');r.innerHTML=`<h2>${esc(d.title)}</h2><h3>Hook</h3><p>${esc(d.hook)}</p><div class="section-title"><h3>الشرائح</h3></div><div class="slides">${slides}</div><div class="section-title"><h3>Caption</h3><button id="copyCaption" class="copy-btn">نسخ Caption</button></div><p id="captionText">${esc(d.caption)}</p><h3>التوصيات</h3><ul>${rec}</ul><h3>CTA</h3><p>${esc(d.cta)}</p><h3>SEO Keywords</h3>${keys}<h3>Hashtags</h3>${tags}<h3>المصادر</h3>${src||'<p>لا توجد مصادر.</p>'}`;$('copyCaption').onclick=()=>copyText(d.caption||'');r.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>generateImage(Number(b.dataset.img)));r.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadImage(Number(b.dataset.download)))}
async function copyText(text){try{await navigator.clipboard.writeText(text);$('msg').textContent='تم نسخ Caption.'}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('msg').textContent='تم نسخ Caption.'}}
async function generateAllImages(){if(!currentRecord)return;for(let i=0;i<(currentRecord.data.slides||[]).length;i++){await generateImage(i,false)}}
async function generateImage(i,save=true){if(!currentRecord)return;const s=currentRecord.data.slides[i];const visual=$('visual-'+i);if(visual)visual.innerHTML='<div class="image-state">جاري إنشاء الصورة...</div>';try{const d=await api('/api/generate-image',{method:'POST',body:JSON.stringify({title:s.headline,body:s.body,slide_number:s.number,post_type:currentRecord.postType})});s.image_b64=d.b64_json;if(save)await saveArchive(currentRecord);renderResult(currentRecord.data,true)}catch(e){if(visual)visual.innerHTML='<div class="image-state">تعذر إنشاء الصورة: '+esc(e.message)+'</div>'}}
function downloadImage(i){const s=currentRecord?.data?.slides?.[i];if(!s?.image_b64)return;const a=document.createElement('a');a.href='data:image/png;base64,'+s.image_b64;a.download=`slide-${s.number}.png`;a.click()}
(async function init(){await refreshUsed();await renderArchive()})();
</script></body></html>
