<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPT Cyber Content</title>
<style>
:root{font-family:Arial,Tahoma,sans-serif;color-scheme:dark;--bg:#06101d;--panel:#0d1a2b;--panel2:#091625;--border:#213a56;--text:#eef6ff;--muted:#9eb2c9;--accent:#1bd3cf;--accent2:#77f2ee;--danger:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.wrap{max-width:1440px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:20px}.hero h1{margin:0;font-size:31px}.hero p{margin:7px 0 0;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{width:auto;margin:0;padding:10px 16px;background:#12263a;color:#dceaff}.tab.active{background:var(--accent);color:#031214}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px}.topics-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.counter{font-size:12px;color:var(--accent2);background:#10283a;padding:5px 9px;border-radius:30px}.topic-list{display:grid;gap:8px;margin-top:12px;max-height:720px;overflow:auto;padding-left:4px}.topic-btn{margin:0;width:100%;text-align:right;padding:12px;border:1px solid #294662;border-radius:12px;background:#0a1726;color:#eaf3ff;cursor:pointer;line-height:1.5}.topic-btn:hover,.topic-btn.selected{border-color:var(--accent);background:#10283a}.topic-btn small{display:block;color:var(--muted);margin-top:4px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;color:#b1c2d6;margin:10px 0 6px}.full{grid-column:1/-1}input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #29435f;background:#071421;color:white}textarea{min-height:88px;resize:vertical}button{border:0;border-radius:11px;padding:12px 15px;margin-top:12px;background:var(--accent);color:#021011;font-weight:700;cursor:pointer}.secondary{background:#172d43;color:#e7f3ff}.ghost{background:transparent;border:1px solid #36526e;color:#cfe3f7}.danger{background:#3a1d28;color:#ffd7df}.button-row{display:flex;gap:8px;flex-wrap:wrap}.button-row button{width:auto}.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}.hidden{display:none!important}.output{margin-top:18px}.output h2{margin-top:0}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}.section-title h3{margin:0}.copy-btn{width:auto;margin:0;padding:8px 11px;background:#173149;color:#dff}.slides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.slide{border:1px solid #294760;border-radius:16px;overflow:hidden;background:var(--panel2)}.slide-visual{aspect-ratio:1/1;background:linear-gradient(135deg,#0b2033,#102b40);position:relative;display:flex;align-items:center;justify-content:center}.slide-visual img{width:100%;height:100%;object-fit:cover;display:block}.image-state{padding:18px;text-align:center;color:#9fb6ca}.slide-content{padding:14px}.slide-content b{color:var(--accent2)}.slide-content h4{margin:8px 0}.slide-content p{color:#d1ddeb;line-height:1.7}.slide-actions{display:flex;gap:7px}.slide-actions button{margin:0;width:auto;font-size:12px;padding:8px 10px}.pill{display:inline-block;padding:5px 9px;margin:3px;border-radius:20px;background:#142d43;color:#c4f5f2}.source{padding:9px 0;border-bottom:1px solid #1b3147}.source a{color:#67e4ff}.archive-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.archive-item{background:#0a1726;border:1px solid #28455f;border-radius:15px;padding:15px}.archive-item h3{font-size:17px;margin:4px 0 8px}.archive-item p{font-size:13px;color:var(--muted)}.archive-item .date{font-size:11px;color:#7f98b1}.archive-item .button-row button{font-size:12px;padding:8px 10px}.empty-state{padding:40px 10px;text-align:center;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:1fr}.topic-list{max-height:340px}.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.wrap{padding:14px}.hero{display:block}.tabs{margin-top:14px}.form-grid,.slides,.archive-grid{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div><h1>GPT Cyber Content</h1><p>استوديو محتوى GRC والأمن السيبراني — محتوى، صور، مصادر وأرشيف منشورات.</p></div><nav class="tabs"><button class="tab active" data-view="studio">الاستوديو</button><button class="tab" data-view="archive">أرشيف المنشورات <span id="archiveCount"></span></button></nav></header>

<section id="studioView" class="layout">
<aside class="card"><div class="topics-head"><strong>مواضيع الـ30 يوم</strong><span class="counter" id="remainingCount">30 متبقي</span></div><div class="topic-list" id="topicList"></div></aside>
<main class="card">
<div class="form-grid">
<div class="full"><label>الموضوع</label><textarea id="topic" placeholder="اختر موضوعًا من القائمة أو اكتب موضوعًا جديدًا"></textarea></div>
<div><label>المجال</label><select id="domain"><option>GRC</option><option>Cybersecurity</option><option>AI Governance</option><option>Privacy</option></select></div>
<div><label>نوع المنشور</label><select id="type"><option>Carousel</option><option>Infographic</option><option>Single Post</option></select></div>
<div><label>المنصة</label><select id="platform"><option>Both</option><option>Instagram</option><option>LinkedIn</option></select></div>
<div><label>عدد الشرائح</label><input id="slides" type="number" min="1" max="10" value="6"></div>
<div class="full"><label>الجمهور</label><input id="audience" value="Government and enterprise cybersecurity professionals"></div>
</div>
<div class="button-row"><button id="generate">إنشاء المحتوى والصور</button><button id="clearSelection" class="secondary">إلغاء اختيار الموضوع</button></div><div id="msg" class="status"></div>
<div id="result" class="output hidden"></div>
</main></section>

<section id="archiveView" class="card hidden"><div class="section-title"><h2>أرشيف المنشورات</h2><button id="refreshArchive" class="secondary">تحديث</button></div><div id="archiveGrid" class="archive-grid"></div></section>
</div>
<script>
const API='https://gptcontent-production.up.railway.app';
const TOPICS=[
{id:1,title:'ما هو GRC ولماذا أصبح أساس الأمن السيبراني؟',detail:'Governance • Risk • Compliance',domain:'GRC'},
{id:2,title:'الفرق بين الأمن السيبراني و GRC',detail:'كيف تتكامل الفرق والمسؤوليات',domain:'GRC'},
{id:3,title:'لماذا تفشل برامج ISO 27001 رغم الحصول على الشهادة؟',detail:'الشهادة مقابل التطبيق المستمر',domain:'GRC'},
{id:4,title:'NIST CSF 2.0 والتغيير الأكبر: وظيفة Govern',detail:'الحوكمة والإدارة العليا',domain:'GRC'},
{id:5,title:'من هو مالك المخاطر الحقيقي داخل المؤسسة؟',detail:'Risk Owners ومسؤولية الأعمال',domain:'GRC'},
{id:6,title:'كيف تبني Risk Register بطريقة صحيحة؟',detail:'سجل المخاطر من التقييم إلى المعالجة',domain:'GRC'},
{id:7,title:'Risk Appetite في الجهات الحكومية',detail:'شهية المخاطر وحدود القبول',domain:'GRC'},
{id:8,title:'Third-Party Risk Management',detail:'مخاطر الموردين والخدمات الخارجية',domain:'GRC'},
{id:9,title:'Supply Chain Cybersecurity',detail:'مخاطر سلسلة التوريد السيبرانية',domain:'Cybersecurity'},
{id:10,title:'Continuous Compliance',detail:'الامتثال المستمر بدل المراجعة السنوية',domain:'GRC'},
{id:11,title:'AI Governance: لماذا أصبح الذكاء الاصطناعي جزءًا من GRC؟',detail:'حوكمة استخدام الذكاء الاصطناعي',domain:'AI Governance'},
{id:12,title:'ISO/IEC 42001 لإدارة الذكاء الاصطناعي',detail:'نظام إدارة الذكاء الاصطناعي',domain:'AI Governance'},
{id:13,title:'Shadow AI داخل المؤسسات',detail:'استخدام أدوات AI دون رقابة',domain:'AI Governance'},
{id:14,title:'Board Cyber Governance',detail:'مسؤولية الإدارة العليا ومجلس الإدارة',domain:'GRC'},
{id:15,title:'KPI vs KRI: ما المؤشرات التي يحتاجها GRC؟',detail:'قياس الأداء مقابل مؤشرات المخاطر',domain:'GRC'},
{id:16,title:'كيف تقيس نضج برنامج GRC؟',detail:'GRC Maturity Assessment',domain:'GRC'},
{id:17,title:'NIS2 باختصار: ما الذي تغير؟',detail:'التوجيه الأوروبي للأمن السيبراني',domain:'GRC'},
{id:18,title:'DORA والمرونة التشغيلية الرقمية',detail:'المؤسسات والقطاع المالي',domain:'GRC'},
{id:19,title:'Cyber Resilience Act وتأثيره على المنتجات الرقمية',detail:'الأمن طوال دورة حياة المنتج',domain:'Cybersecurity'},
{id:20,title:'إدارة الاستثناءات الأمنية بطريقة صحيحة',detail:'Security Exceptions ومدة الصلاحية',domain:'GRC'},
{id:21,title:'Security Awareness أم Security Culture؟',detail:'التدريب مقابل تغيير السلوك',domain:'Cybersecurity'},
{id:22,title:'لماذا تفشل سياسات الأمن السيبراني؟',detail:'Policy Management والتطبيق الفعلي',domain:'GRC'},
{id:23,title:'Least Privilege ومراجعة الصلاحيات',detail:'حوكمة الوصول والصلاحيات',domain:'Cybersecurity'},
{id:24,title:'إدارة الثغرات من منظور GRC',detail:'ربط Vulnerability Management بالمخاطر',domain:'GRC'},
{id:25,title:'إدارة الحوادث وعلاقتها بإدارة المخاطر',detail:'Incident Management + Risk',domain:'GRC'},
{id:26,title:'ماذا يبحث المدقق الداخلي في الأمن السيبراني؟',detail:'Audit Evidence وفعالية الضوابط',domain:'GRC'},
{id:27,title:'Business Continuity وعلاقته بـ GRC',detail:'BCM والمرونة المؤسسية',domain:'GRC'},
{id:28,title:'Cyber Metrics التي يجب عرضها للإدارة العليا',detail:'Executive Cyber Dashboard',domain:'GRC'},
{id:29,title:'أكثر 10 أخطاء شائعة في برامج GRC',detail:'أخطاء عملية وكيفية معالجتها',domain:'GRC'},
{id:30,title:'مستقبل GRC: AI Governance وAutomation وContinuous Compliance',detail:'اتجاهات GRC الحديثة',domain:'GRC'}
];
let selectedTopicId=null,currentRecord=null,usedTopicIds=new Set();
const $=id=>document.getElementById(id);

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('GPTCyberContentDB',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('posts'))db.createObjectStore('posts',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(post){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('posts','readwrite');tx.objectStore('posts').put(post);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function dbAll(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction('posts','readonly').objectStore('posts').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function dbGet(id){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction('posts','readonly').objectStore('posts').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbDelete(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('posts','readwrite');tx.objectStore('posts').delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}

async function syncUsed(){const posts=await dbAll();usedTopicIds=new Set(posts.filter(p=>p.topicId).map(p=>p.topicId));renderTopics();$('archiveCount').textContent=posts.length?`(${posts.length})`:''}
function renderTopics(){const available=TOPICS.filter(t=>!usedTopicIds.has(t.id));$('remainingCount').textContent=`${available.length} متبقي`;$('topicList').innerHTML=available.length?available.map(t=>`<button class="topic-btn ${selectedTopicId===t.id?'selected':''}" data-id="${t.id}"><strong>${t.id}. ${esc(t.title)}</strong><small>${esc(t.detail)}</small></button>`).join(''):'<div class="empty-state">تم استخدام جميع مواضيع الخطة. ستجدها في الأرشيف.</div>';document.querySelectorAll('.topic-btn').forEach(b=>b.addEventListener('click',()=>selectTopic(Number(b.dataset.id))))}
function selectTopic(id){const t=TOPICS.find(x=>x.id===id);if(!t)return;selectedTopicId=id;$('topic').value=t.title;$('domain').value=t.domain;renderTopics();$('topic').focus()}
$('clearSelection').addEventListener('click',()=>{selectedTopicId=null;$('topic').value='';renderTopics()});

$('generate').addEventListener('click',generatePost);
async function generatePost(){const topic=$('topic').value.trim();if(!topic){setMsg('اختر موضوعًا أو اكتب موضوعًا جديدًا.');return}const btn=$('generate');btn.disabled=true;setMsg('جاري إنشاء المحتوى والبحث في المصادر...');try{const r=await fetch(API+'/api/generate-content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,domain:$('domain').value,post_type:$('type').value,platform:$('platform').value,audience:$('audience').value,language:'Arabic',slides:Number($('slides').value),use_web_search:true})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Content API error');const id='post_'+Date.now();currentRecord={id,topicId:selectedTopicId,topicOriginal:topic,createdAt:new Date().toISOString(),postType:$('type').value,platform:$('platform').value,data:d,images:{}};await dbPut(currentRecord);if(selectedTopicId)usedTopicIds.add(selectedTopicId);selectedTopicId=null;renderTopics();renderPost(currentRecord);await syncUsed();setMsg('تم إنشاء المحتوى ونقله إلى الأرشيف. جاري إنشاء صورة خاصة لكل سلايد...');await generateAllImages(currentRecord);setMsg('اكتمل المحتوى والصور وتم تحديث الأرشيف.')}catch(e){setMsg('خطأ: '+e.message)}finally{btn.disabled=false}}

async function generateAllImages(record){const slides=record.data.slides||[];for(const slide of slides){await generateSlideImage(record,slide)}await dbPut(record);await renderArchive()}
async function generateSlideImage(record,slide){const box=document.querySelector(`[data-image-for="${slide.number}"]`);if(box)box.innerHTML='<div class="image-state">جاري تصميم صورة السلايد...</div>';try{const r=await fetch(API+'/api/generate-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:slide.headline,body:slide.body||'',slide_number:slide.number,post_type:record.postType,visual_direction:'Modern premium GRC and cybersecurity editorial visual, sophisticated dark navy environment, cyan data accents, professional UAE government and enterprise context when people appear'})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Image API error');record.images[slide.number]=d.b64_json;await dbPut(record);paintSlideImage(slide.number,d.b64_json)}catch(e){if(box)box.innerHTML=`<div class="image-state">تعذر إنشاء الصورة.<br>${esc(e.message)}</div>`}}
function paintSlideImage(n,b64){const box=document.querySelector(`[data-image-for="${n}"]`);if(box&&b64)box.innerHTML=`<img alt="صورة السلايد ${n}" src="data:image/png;base64,${b64}">`}

function renderPost(record){currentRecord=record;const d=record.data;$('result').classList.remove('hidden');let slides=(d.slides||[]).map(x=>`<article class="slide"><div class="slide-visual" data-image-for="${x.number}">${record.images&&record.images[x.number]?`<img alt="صورة السلايد ${x.number}" src="data:image/png;base64,${record.images[x.number]}">`:'<div class="image-state">بانتظار إنشاء الصورة...</div>'}</div><div class="slide-content"><b>Slide ${x.number}</b><h4>${esc(x.headline)}</h4><p>${esc(x.body)}</p><div class="slide-actions"><button class="secondary regen" data-slide="${x.number}">إعادة إنشاء الصورة</button>${record.images&&record.images[x.number]?`<button class="ghost download-image" data-slide="${x.number}">تنزيل الصورة</button>`:''}</div></div></article>`).join('');let tags=(d.hashtags||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('');let keys=(d.keywords||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('');let rec=(d.recommendations||[]).map(x=>`<li>${esc(x)}</li>`).join('');let src=(d.sources||[]).map(x=>`<div class="source"><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a> — ${esc(x.why_relevant||'')}</div>`).join('');$('result').innerHTML=`<h2>${esc(d.title)}</h2><h3>Hook</h3><p>${esc(d.hook)}</p><div class="section-title"><h3>الشرائح والتصاميم</h3><span class="counter">${(d.slides||[]).length} سلايد</span></div><div class="slides">${slides}</div><div class="section-title"><h3>Caption</h3><button id="copyCaption" class="copy-btn">نسخ Caption</button></div><p id="captionText">${esc(d.caption)}</p><h3>التوصيات</h3><ul>${rec}</ul><h3>Call to Action</h3><p>${esc(d.cta)}</p><h3>SEO Keywords</h3>${keys}<h3>Hashtags</h3>${tags}<h3>المصادر</h3>${src||'<p>لا توجد مصادر في وضع Demo.</p>'}`;$('copyCaption').addEventListener('click',()=>copyText(d.caption,$('copyCaption')));document.querySelectorAll('.regen').forEach(b=>b.addEventListener('click',async()=>{const slide=d.slides.find(s=>s.number===Number(b.dataset.slide));b.disabled=true;await generateSlideImage(record,slide);b.disabled=false;renderPost(record)}));document.querySelectorAll('.download-image').forEach(b=>b.addEventListener('click',()=>downloadImage(record,Number(b.dataset.slide))))}
function downloadImage(record,n){const b64=record.images&&record.images[n];if(!b64)return;const a=document.createElement('a');a.href='data:image/png;base64,'+b64;a.download=`${fileSafe(record.data.title)}-slide-${n}.png`;document.body.appendChild(a);a.click();a.remove()}

async function copyText(text,button){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const old=button.textContent;button.textContent='تم النسخ ✓';setTimeout(()=>button.textContent=old,1400)}catch(e){setMsg('تعذر النسخ تلقائيًا.') }}

async function renderArchive(){const posts=(await dbAll()).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));$('archiveCount').textContent=posts.length?`(${posts.length})`:'';$('archiveGrid').innerHTML=posts.length?posts.map(p=>`<article class="archive-item"><div class="date">${formatDate(p.createdAt)}</div><h3>${esc(p.data.title||p.topicOriginal)}</h3><p>${esc(p.postType)} • ${esc(p.platform)} • ${(p.data.slides||[]).length} سلايد</p><div class="button-row"><button class="secondary open-post" data-id="${p.id}">فتح المنشور</button><button class="ghost restore-topic" data-id="${p.id}">إعادة الموضوع للقائمة</button></div></article>`).join(''):'<div class="empty-state">لا توجد منشورات في الأرشيف بعد.</div>';document.querySelectorAll('.open-post').forEach(b=>b.addEventListener('click',()=>openArchived(b.dataset.id)));document.querySelectorAll('.restore-topic').forEach(b=>b.addEventListener('click',()=>restoreTopic(b.dataset.id)))}
async function openArchived(id){const p=await dbGet(id);if(!p)return;showView('studio');$('topic').value=p.topicOriginal||p.data.title;renderPost(p);setMsg('تم فتح المنشور من الأرشيف.')}
async function restoreTopic(id){const p=await dbGet(id);if(!p)return;await dbDelete(id);await syncUsed();await renderArchive();if(p.topicId){const t=TOPICS.find(x=>x.id===p.topicId);if(t)selectTopic(t.id)}setMsg('تمت إعادة الموضوع إلى قائمة المواضيع وحذف النسخة من الأرشيف.');showView('studio')}

function showView(view){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));$('studioView').classList.toggle('hidden',view!=='studio');$('archiveView').classList.toggle('hidden',view!=='archive');if(view==='archive')renderArchive()}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showView(t.dataset.view)));$('refreshArchive').addEventListener('click',renderArchive);
function setMsg(s){$('msg').textContent=s}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(u=''){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}
function fileSafe(s='post'){return String(s).replace(/[\\/:*?"<>|]+/g,'-').slice(0,80)}
function formatDate(s){try{return new Intl.DateTimeFormat('ar-AE',{dateStyle:'medium',timeStyle:'short'}).format(new Date(s))}catch{return s}}
(async()=>{try{await syncUsed();await renderArchive()}catch(e){setMsg('ملاحظة: تعذر فتح الأرشيف المحلي في هذا المتصفح: '+e.message)}})();
</script></body></html>
