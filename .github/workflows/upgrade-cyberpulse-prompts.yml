name: Upgrade Cyber Pulse prompts

on:
  push:
    paths:
      - 'scripts/upgrade_cyberpulse_prompts.py'
      - 'scripts/fix_cyberpulse_editorial.py'
      - 'scripts/repair_index_download.py'
      - 'scripts/fix_cyberpulse_card_v2.py'
      - 'scripts/fix_cyberpulse_footer_logo_fit.py'
      - '.github/workflows/upgrade-cyberpulse-prompts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index and add image download
        run: python scripts/repair_index_download.py
      - name: Apply Cyber Pulse prompt upgrade
        run: python scripts/upgrade_cyberpulse_prompts.py
      - name: Apply Cyber Pulse editorial fixes
        run: python scripts/fix_cyberpulse_editorial.py
      - name: Apply Cyber Pulse card v2
        run: python scripts/fix_cyberpulse_card_v2.py
      - name: Apply Cyber Pulse footer, logo and fit
        run: python scripts/fix_cyberpulse_footer_logo_fit.py
      - name: Commit upgraded prompts
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py index.html
          git commit -m "Apply Cyber Pulse logo, rights footer and text fit"
          git push
